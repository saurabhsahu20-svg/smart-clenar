name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_MANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDK_MANAGER" ]; then echo 'sdkmanager not found'; exit 1; fi
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: S-Cache-Cleaner-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
