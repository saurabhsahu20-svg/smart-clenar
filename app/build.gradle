plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sclean.cachecleaner'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sclean.cachecleaner'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
